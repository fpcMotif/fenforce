name: Affected package tasks
inputs:
  parallel:
    required: false
    default: '3'
  tag:
    required: false
  tasks:
    required: true
  configuration:
    required: false
    default: 'ci'
  args:
    required: false
runs:
  using: composite
  steps:
    - name: Resolve comparison base
      shell: bash
      run: |
        base_sha="${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}"
        if [ -z "$base_sha" ]; then
          git fetch origin main --depth=1
          base_sha="$(git rev-parse origin/main)"
        fi
        git fetch origin "$base_sha" --depth=1
        echo "AFFECTED_BASE=$base_sha" >> "$GITHUB_ENV"
    - name: Run affected package tasks
      shell: bash
      env:
        TASK_CONFIGURATION: ${{ inputs.configuration }}
        TASKS: ${{ inputs.tasks }}
        TASK_PARALLEL: ${{ inputs.parallel }}
        TASK_TAG: ${{ inputs.tag }}
        TASK_ARGS: ${{ inputs.args }}
      run: bun .github/actions/affected-tasks/run.mjs "$AFFECTED_BASE"
