name: CI Docs

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changed-files-check:
    uses: ./.github/workflows/changed-files.yaml
    with:
      files: |
        package.json
        bun.lock
        packages/twenty-ui/**
        packages/twenty-shared/**
        .github/workflows/ci-docs.yaml
        packages/twenty-docs/**

  docs-lint:
    needs: changed-files-check
    if: needs.changed-files-check.outputs.any_changed == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Fetch local actions
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 10

      - name: Install dependencies
        uses: ./.github/actions/bun-install

      - name: Docs / Lint
        run: bunx vite-plus run twenty-docs#lint

      - name: Docs / Test
        run: bunx vite-plus run twenty-docs#test

      - name: Docs / Generated UI references
        run: bunx vite-plus run twenty-docs#check:ui

      - name: Docs / Storybook embeds
        run: bunx vite-plus run twenty-docs#check:ui-stories
